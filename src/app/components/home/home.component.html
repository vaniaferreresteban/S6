@if (budgetsFormArray) {
  <form [formGroup]="budgetsForm">
    <section formArrayName="budgetsFormArray">
      @for (
        budgetControl of budgetsFormArray.controls;
        track $index;
        let i = $index
      ) {
        <article [formGroupName]="i">
          <div>
            <h2>{{ budgets()[i].name }}</h2>
            <p>{{ budgets()[i].description }}</p>
          </div>
          <div>{{ budgets()[i].price }} €</div>
          <div>
            <mat-checkbox [id]="'budget-' + i" formControlName="selected" />
            <p>Afegir</p>
          </div>

          @if (budgetControl.value.selected && budgets()[i].options) {
            <app-panel
              [panelForm]="getAsFormGroup(budgetControl.get('options'))"
              [options]="budgets()[i].options ?? []"
            ></app-panel>
          }
        </article>
      }
    </section>
  </form>
}

<div>
  <strong>Total: {{ totalBudget() }} €</strong>
</div>
<form
  class="create-client"
  [formGroup]="clientForm"
  (ngSubmit)="createClient()"
>
  <div>
    <label for="name">Nom: </label>
    <input id="name" formControlName="name" type="text" />
  </div>

  <div>
    <label for="telephone">Telèfon: </label>
    <input id="telephone" formControlName="telephone" type="tel" />
  </div>

  <div>
    <label for="email">Email: </label>
    <input id="email" formControlName="email" type="email" />
  </div>

  <button type="submit" [disabled]="!clientForm.valid">
    Sol·licitar Pressupost
  </button>
</form>
